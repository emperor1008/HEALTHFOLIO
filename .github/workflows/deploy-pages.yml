name: Deploy Healthfolio public showcase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: healthfolio-pages
  cancel-in-progress: true

jobs:
  verify_showcase:
    name: Verify public showcase
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Confirm showcase exists
        run: |
          test -f showcase/index.html

      - name: Scan showcase for confidential or development content
        run: |
          ! grep -rInE 'Test mode|development only|FreeBuff|localhost:11434|SUPABASE_SERVICE_ROLE_KEY|AI_API_KEY' showcase/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload showcase
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./showcase

  deploy:
    name: Deploy public showcase
    needs: verify_showcase
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4